syntax = "proto3";

package encfs.v7;

// V7 EncFS configuration (protocol buffer format).
// Top-level message: encrypted key, Argon2 KDF params, cipher, name encoding, feature flags.

message Config {
  // AEAD-wrapped volume key: nonce (12) || ciphertext || tag (16). AAD = SHA-256(rest of config).
  bytes encrypted_key = 1;

  // Argon2 KDF parameters and salt (required for V7).
  Argon2Kdf argon2 = 2;

  oneof cipher {
    // Legacy block cipher and block-level options (V4-V6 compatible behavior).
    BasicBlockCipher legacy = 3;

    // AES-GCM-SIV block configuration (V7 authenticated block mode).
    AesGcmSivBlockCipher gcm_siv = 7;
  }

  // Filename encoding and name IV options.
  NameEncoding name_encoding = 4;

  // Remaining behavior flags (e.g. allow_holes).
  FeatureFlags feature_flags = 5;

  // Hash of the config (with encrypted_key and config_hash cleared), used as AEAD AAD.
  bytes config_hash = 6;

  // Minimum reader version required to interpret this config. 0 on the wire
  // means the base V7 format (version 1); readers must special-case that.
  // Gates the whole config, not just the block cipher, so it lives here
  // rather than inside AesGcmSivBlockCipher.
  uint32 minimum_reader_version = 8;
}

message Argon2Kdf {
  bytes salt = 1;
  uint32 memory_cost_kib = 2; // Argon2 memory cost in KiB
  uint32 time_cost = 3; // iterations
  uint32 parallelism = 4;
}

enum BlockCipherAlgorithm {
  BLOCK_CIPHER_ALGORITHM_UNSPECIFIED = 0;
  BLOCK_CIPHER_ALGORITHM_AES = 1;
  BLOCK_CIPHER_ALGORITHM_BLOWFISH = 2;
}

message BasicBlockCipher {
  BlockCipherAlgorithm algorithm = 1;
  int32 key_size = 2; // e.g. 128, 192, 256 for AES
  int32 block_size = 3;
  int32 block_mac_bytes = 4;
  int32 block_mac_rand_bytes = 5; // must be 0 for current implementation
  bool unique_iv = 6;
}

// Width of the random per-file IV. FILE_IV_WIDTH_64 is the zero value so an
// absent/omitted field (all configs written before this ADR) means 64-bit.
// Leaves room for a future FILE_IV_WIDTH_128 without adding a new field;
// any new value must be paired with a minimum_reader_version bump so old
// readers fail closed instead of silently misreading it as 64-bit.
enum FileIvWidth {
  FILE_IV_WIDTH_64 = 0;
  FILE_IV_WIDTH_96 = 1;
}

message AesGcmSivBlockCipher {
  int32 key_size = 1; // AES key size in bits (128 or 256)
  int32 block_size = 2;
  bool unique_iv = 3;
  FileIvWidth file_iv_width = 4;
}

enum NameEncodingMode {
  NAME_ENCODING_MODE_UNSPECIFIED = 0;
  NAME_ENCODING_MODE_STREAM = 1;
  NAME_ENCODING_MODE_BLOCK = 2;
}

message NameEncoding {
  NameEncodingMode mode = 1;
  bool chained_name_iv = 2;
  bool external_iv_chaining = 3;
}

message FeatureFlags {
  bool allow_holes = 1;
}
